##
# Nginx vhost for Docker Compose stack in docker-compose.yaml
# - Frontend container is exposed on host port 3001
# - Backend container is exposed on host port 5001
#
# Replace server_name values with your real domain(s).
##

upstream vuleits_frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream vuleits_backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name vuleits.com www.vuleits.com;

    # Allow larger admin/media uploads when needed.
    client_max_body_size 50m;

    # Preserve original client/IP information.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket/SSE support for Next.js.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;

    # API requests go to backend container.
    location /api/ {
        proxy_pass http://vuleits_backend;
    }

    # Upload previews/files should always hit backend static `public/uploads`.
    location /uploads/ {
        proxy_pass http://vuleits_backend;
    }

    # Everything else goes to frontend container.
    location / {
        proxy_pass http://vuleits_frontend;
    }
}
